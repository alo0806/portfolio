<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="bleed" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="54" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feGaussianBlur in="shape" stdDeviation="2.2"/>
    </filter>
  </defs>
  <g filter="url(#bleed)">
    <circle cx="200" cy="200" r="148" fill="#000" fill-opacity="0.5"/>
    <circle cx="200" cy="200" r="126" fill="#000" fill-opacity="0.4"/>
    <circle cx="200" cy="200" r="146" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="7"/>
  </g>
</svg>
