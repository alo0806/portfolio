<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Austin Lo — cognitive science at UCLA. Designs in Figma, builds in React." />
    <meta name="theme-color" content="#15132B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without holding up the first paint: the stylesheet is
         fetched as a preload and applied when it arrives (text shows in the
         fallback font until then, then swaps). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@300;400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@300;400;500&display=swap"
      />
    </noscript>
    <script>
      /* Apply the saved theme before first paint (so a returning dark-mode
         visitor never sees a flash of light). Light unless chosen otherwise. */
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem('astnlo:theme')
        } catch (e) {}
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light'
      })()
    </script>
    <title>Austin Lo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
