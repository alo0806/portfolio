<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A small record: indigo disc, groove rings, orange label with the
       mascot's eyes. Drawn at 32px or less (browser tabs), the grooves
       drop out and the label and eyes grow so it still reads. -->
  <style>
    .small { display: none; }
    @media (max-width: 32px) {
      .big { display: none; }
      .small { display: inline; }
    }
  </style>
  <g class="big">
    <circle cx="32" cy="32" r="30" fill="#15132B"/>
    <circle cx="32" cy="32" r="29.2" fill="none" stroke="#3B2D7A" stroke-width="1.6"/>
    <g fill="none" stroke="#EDEBF5" stroke-opacity="0.16" stroke-width="0.9">
      <circle cx="32" cy="32" r="25.5"/>
      <circle cx="32" cy="32" r="22.5"/>
      <circle cx="32" cy="32" r="19.5"/>
    </g>
    <path d="M11.6 22.4 A22.6 22.6 0 0 1 22.4 11.6" fill="none" stroke="#EDEBF5" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="14" fill="#FF6B35"/>
    <ellipse cx="27.4" cy="31.2" rx="3.3" ry="4" fill="#FBFAF7"/>
    <ellipse cx="36.6" cy="31.2" rx="3.3" ry="4" fill="#FBFAF7"/>
    <circle cx="27.8" cy="31.8" r="1.9" fill="#15132B"/>
    <circle cx="37" cy="31.8" r="1.9" fill="#15132B"/>
    <circle cx="28.5" cy="31" r="0.6" fill="#FBFAF7"/>
    <circle cx="37.7" cy="31" r="0.6" fill="#FBFAF7"/>
  </g>
  <g class="small">
    <circle cx="32" cy="32" r="30.5" fill="#15132B"/>
    <circle cx="32" cy="32" r="29" fill="none" stroke="#4A3F99" stroke-width="3"/>
    <circle cx="32" cy="32" r="18.5" fill="#FF6B35"/>
    <ellipse cx="25.6" cy="31" rx="4.8" ry="5.8" fill="#FBFAF7"/>
    <ellipse cx="38.4" cy="31" rx="4.8" ry="5.8" fill="#FBFAF7"/>
    <circle cx="26.2" cy="32" r="2.9" fill="#15132B"/>
    <circle cx="39" cy="32" r="2.9" fill="#15132B"/>
  </g>
</svg>
